name: ESP32 firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending runner time on stale commits when newer changes arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ESP32 sketches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: "[]"
          # The repository root is searched recursively; this finds both
          # the main sketch and the standalone sketch without compiling the
          # standalone sketch twice.
          sketch-paths: |
            - .
          enable-warnings-report: true
