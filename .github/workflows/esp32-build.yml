name: ESP32 firmware build

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

# Avoid spending runner time on stale commits when newer changes arrive.
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  compile:
    name: Compile ESP32 sketches
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v7
      - name: Check sketch synchronization and security invariants
        run: python3 scripts/check_sketch_sync.py
      - name: Check documentation links and route reference
        run: python3 scripts/check_docs.py
      - name: Compile both ESP32 sketches
        uses: arduino/compile-sketches@v1
        with:
          fqbn: esp32:esp32:esp32
          platforms: |
            - name: esp32:esp32
              source-url: https://espressif.github.io/arduino-esp32/package_esp32_index.json
          libraries: "[]"
          # The repository root is searched recursively, so both sketch folders
          # are found without compiling the standalone sketch twice.
          sketch-paths: |
            - .
          sketches-report-path: sketches-reports
          enable-warnings-report: true
      - name: Archive compiler report
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: esp32-compile-report
          path: sketches-reports/
          if-no-files-found: warn
          retention-days: 14
